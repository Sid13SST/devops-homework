# The GitOps object itself: it tells Argo CD which Git repository and path hold the
# desired state, and where to apply it. Git is the source of truth - nobody runs
# kubectl against the cluster; they commit, and Argo CD reconciles.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Sid13SST/devops-homework.git
    targetRevision: main
    path: session20/gitops/app-manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # revert manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
