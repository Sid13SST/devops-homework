# Gitleaks configuration for the Session 17 DevSecOps pipeline.
# Extends the default rule set and scopes scanning to the application source.
title = "campus-secure-api secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and lock files produce no real credentials"
paths = [
  '''package-lock\.json''',
  '''coverage/''',
]
