apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-pvc
spec:
  # storageClassName: "" disables dynamic provisioning, so this claim binds to the
  # manually created student-pv instead of asking the default StorageClass for a new volume.
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
