# Horizontal autoscaling on CPU (Session 13 concept).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: campus-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: campus-portal
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
