apiVersion: v1
kind: Secret
metadata:
  name: yatri-db-secret
  labels:
    app: yatri-app
type: Opaque
data:
  # Base64 is ENCODING, not encryption. Generated with `echo -n` so that no
  # trailing 0x0a newline byte corrupts the credential (see Task 4).
  POSTGRES_USER: eWF0cmlfYWRtaW4=          # yatri_admin
  POSTGRES_PASSWORD: c2VjcmV0cGFzc3dvcmQ=  # secretpassword
