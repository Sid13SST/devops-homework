# Multi-document manifest: Deployment + Service co-located, separated by ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-app
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yatri-app
      tier: backend
  template:
    metadata:
      labels:
        app: yatri-app
        tier: backend
    spec:
      containers:
        - name: backend
          image: busybox:1.36
          ports:
            - containerPort: 8080
          # BULK injection of every non-sensitive key from the ConfigMap
          envFrom:
            - configMapRef:
                name: yatri-app-config
          # GRANULAR injection of individual sensitive keys from the Secret
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              mkdir -p /www
              printf 'Yatri Backend API\nENVIRONMENT: %s\nLOG_LEVEL: %s\nPORT: %s\nDEFAULT_CURRENCY: %s\nMAX_BOOKING_DAYS: %s\nPOSTGRES_USER: %s\nPOSTGRES_PASSWORD: %s\n' \
                "$ENVIRONMENT" "$LOG_LEVEL" "$PORT" "$DEFAULT_CURRENCY" "$MAX_BOOKING_DAYS" \
                "$POSTGRES_USER" "$POSTGRES_PASSWORD" > /www/index.html
              exec httpd -f -p 8080 -h /www
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-service
  labels:
    app: yatri-app
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: yatri-app
    tier: backend
  ports:
    - port: 8080
      targetPort: 8080
