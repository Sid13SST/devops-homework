# BROKEN: the container runs a command that exits non-zero straight away.
# restartPolicy defaults to Always, so the kubelet restarts it in a widening
# backoff loop -> CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
  labels:
    demo: crashloopbackoff
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args: ["echo 'starting up...'; echo 'FATAL: config file /etc/app/config.yaml not found'; exit 1"]
