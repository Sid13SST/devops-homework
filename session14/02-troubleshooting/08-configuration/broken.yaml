# BROKEN: the container demands the key DATABASE_URL from a ConfigMap that only
# has APP_NAME. A required key that is missing gives CreateContainerConfigError.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-env
  labels:
    demo: configuration
data:
  APP_NAME: "troubleshooting-demo"
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  labels:
    demo: configuration
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args: ["echo APP_NAME=$APP_NAME DATABASE_URL=$DATABASE_URL; sleep 3600"]
      env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: app-env
              key: APP_NAME
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-env
              key: DATABASE_URL
