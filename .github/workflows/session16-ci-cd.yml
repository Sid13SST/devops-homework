name: Session 16 - CI/CD Pipeline

# CI runs on every push that touches the app; CD runs after CI succeeds.
on:
  push:
    branches: [main]
    paths:
      - 'session16/**'
      - '.github/workflows/session16-ci-cd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/campus-notes-api
  WORKDIR: session16/app

jobs:
  # ---------------------------------------------------------------- CI: build + test
  build-and-test:
    name: CI - Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: ${{ env.WORKDIR }}
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: ${{ env.WORKDIR }}
        run: npm test

      - name: Upload coverage report as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.WORKDIR }}/coverage/
          retention-days: 7

  # ------------------------------------------------- CI: docker image build and push
  docker-build-push:
    name: CI - Docker Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is an automatically provided repository secret
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and export it for the CD job
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Save image as a tar artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o /tmp/campus-notes-api.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: /tmp/campus-notes-api.tar
          retention-days: 1

      - name: Push image to GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Show pushed tags
        run: |
          echo "Pushed:"
          echo "  ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "  ${{ env.IMAGE_NAME }}:latest"

  # ------------------------------------------------------- CD: deploy to Kubernetes
  deploy:
    name: CD - Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create a Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: cd-cluster

      - name: Show cluster info
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Download the image built by CI
        uses: actions/download-artifact@v4
        with:
          name: container-image
          path: /tmp

      - name: Load the image into the cluster
        run: |
          docker load -i /tmp/campus-notes-api.tar
          kind load docker-image ${{ env.IMAGE_NAME }}:${{ github.sha }} --name cd-cluster

      - name: Deploy the manifests
        run: |
          cd session16/k8s
          kubectl set image --local -f deployment.yaml \
            api=${{ env.IMAGE_NAME }}:${{ github.sha }} -o yaml > deployment-pinned.yaml
          kubectl apply -f deployment-pinned.yaml
          kubectl apply -f service.yaml

      - name: Wait for the rollout to finish
        run: kubectl rollout status deployment/campus-notes-api --timeout=180s

      - name: Verify the running deployment
        run: |
          kubectl get deployment,pod,svc -l app=campus-notes-api -o wide
          echo "--- endpoint check from inside the cluster ---"
          kubectl run verify --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet -- \
            curl -s http://campus-notes-api.default.svc.cluster.local/
          echo ""
          echo "--- notes endpoint ---"
          kubectl run verify2 --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet -- \
            curl -s http://campus-notes-api.default.svc.cluster.local/api/notes
          echo ""

      - name: Pipeline summary
        run: |
          echo "### Session 16 CD summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Cluster: kind (cd-cluster)" >> $GITHUB_STEP_SUMMARY
          echo "- Rollout: completed" >> $GITHUB_STEP_SUMMARY
